name: ci-cd

# 3-tier pipeline: develop → dev, test → stage, main / v* tags → prod.
# GitHub Actions validates, builds, and migrates. Vercel Git integration
# performs the actual deploys (Development / Preview / Production).
# Migrations promote dev → stage → prod, never prod first. Secrets
# DEV/STAGE/PROD_DATABASE_URL hold the pooled per-branch Neon URLs.

on:
  push:
    branches: [develop, test, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, test, main]

env:
  APP_ENV: ${{ (github.ref_type == 'tag' && 'prod') || (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/test' && 'stage') || 'dev' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter @pixa/web
        env:
          DATABASE_URL: ${{ secrets[format('{0}_DATABASE_URL', env.APP_ENV == 'prod' && 'PROD' || env.APP_ENV == 'stage' && 'STAGE' || 'DEV')] }}
          BETTER_AUTH_SECRET: dummy-build-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000

  migrate:
    # Schema migrates only on push (never on PRs). Stage migrates after
    # develop is merged into test; prod migrates after test is merged
    # into main — enforced by branch protection, not by job ordering.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migrate target tier
        run: pnpm exec drizzle-kit migrate --config ./drizzle.config.ts
        env:
          DATABASE_URL: ${{ secrets[format('{0}_DATABASE_URL', env.APP_ENV == 'prod' && 'PROD' || env.APP_ENV == 'stage' && 'STAGE' || 'DEV')] }}
